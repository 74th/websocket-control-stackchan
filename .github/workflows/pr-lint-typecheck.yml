name: PR Lint and Type Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pr-lint-typecheck.yml"
      - "Makefile"
      - "platformio.ini"
      - "platformio-m5stack.ini"
      - "pyproject.toml"
      - "protobuf/**"
      - "uv.lock"
      - "firmware/lib/generated_protobuf/**"
      - "stackchan_server/**"
      - "example_apps/**"
  pull_request:
    paths:
      - ".github/workflows/pr-lint-typecheck.yml"
      - "Makefile"
      - "platformio.ini"
      - "platformio-m5stack.ini"
      - "pyproject.toml"
      - "protobuf/**"
      - "uv.lock"
      - "firmware/lib/generated_protobuf/**"
      - "stackchan_server/**"
      - "example_apps/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff
        run: uv run ruff check stackchan_server example_apps

      - name: ty
        run: uv run ty check stackchan_server example_apps

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Verify generated protobuf files are up to date
        run: |
          set -euo pipefail
          pio pkg install -e m5stack-cores3-m5unified
          make protobuf
          git diff --stat -- stackchan_server/generated_protobuf firmware/lib/generated_protobuf
          git diff --exit-code -- stackchan_server/generated_protobuf firmware/lib/generated_protobuf
